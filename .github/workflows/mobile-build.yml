name: Mobile — EAS Build

# ────────────────────────────────────────────────────────────
# Triggers:
#   • Automatic: push to main touching anything in mobile/
#   • Manual:    workflow_dispatch with profile choice
#
# The EXPO_TOKEN secret must be set in repo Settings → Secrets.
# Get it from: https://expo.dev/accounts/[you]/settings/access-tokens
# ────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true   # cancel in-progress build if a newer commit arrives

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # ── Install ───────────────────────────────────────────
      - name: Install dependencies
        run: cd mobile && npm ci

      # ── Tests (non-blocking if no test script) ────────────
      - name: Run tests
        run: cd mobile && npm test --if-present
        continue-on-error: false

      # ── Expo EAS CLI ──────────────────────────────────────
      - name: Set up Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── Build ─────────────────────────────────────────────
      - name: EAS Build
        run: |
          cd mobile && eas build \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --platform ${{ github.event.inputs.platform || 'android' }} \
            --non-interactive \
            --no-wait
        # --no-wait: EAS builds are queued remotely. The job exits after
        # submitting the build, not after it completes. Check the EAS
        # dashboard at https://expo.dev for build status and download link.

      # ── Summary ───────────────────────────────────────────
      - name: Build submitted
        run: |
          echo "✅ EAS build submitted successfully."
          echo "👉 View status: https://expo.dev/accounts/mantu-09/projects/tezznirmaan/builds"
          echo "Profile: ${{ github.event.inputs.profile || 'preview' }}"
          echo "Platform: ${{ github.event.inputs.platform || 'android' }}"

  # ── Maestro E2E ──────────────────────────────────────────────
  # Runs ONLY on main branch pushes (not manual workflow_dispatch).
  # Requires an Expo dev-client build already installed on the simulator.
  # Until a persistent simulator device is provisioned in CI, this job
  # serves as a structural validator and local-run helper.
  # Set MAESTRO_DRIVER secret to 'ios' or 'android' to activate.
  e2e:
    name: Maestro E2E (iOS Simulator)
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true   # flaky Maestro tests should not block builds

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # Install Maestro CLI
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro installation
        run: maestro --version

      # Boot the iOS simulator (Expo Go must be pre-installed via EAS)
      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; \
              iphones=[d for v in devs.values() for d in v \
                if 'iPhone' in d['name'] and d['isAvailable']]; \
              print(iphones[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          echo "Booted simulator: $UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      # Run the full Maestro flow suite
      # NOTE: This will only pass once an Expo dev-client .app is installed
      # on the simulator. For now it validates YAML syntax + Maestro connectivity.
      - name: Run E2E flows
        run: cd mobile && maestro test maestro/flows/ --format junit --output maestro-results.xml
        env:
          # Override API base URL to point to staging, not prod
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.STAGING_API_URL || 'https://api.tezznirmaan.in/api/v1' }}
        continue-on-error: true

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-results
          path: mobile/maestro-results.xml
          if-no-files-found: ignore

