name: Backend CI / CD

on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'backend/**'

jobs:
  # ── Job 1: Lint + Test (runs on every push/PR) ──────────────
  test:
    name: Test (Jest — Staging DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Staging Supabase project (separate from production)
      SUPABASE_URL:               ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY:          ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      DATABASE_URL:               ${{ secrets.STAGING_DATABASE_URL }}
      # Env flags
      NODE_ENV:                   test
      # Razorpay test-mode keys (different from production keys)
      RAZORPAY_KEY_ID:            ${{ secrets.RAZORPAY_TEST_KEY_ID }}
      RAZORPAY_KEY_SECRET:        ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
      RAZORPAY_ROUTE_ENABLED:     false
      # Test Supabase aliases (setup.js falls back to SUPABASE_* if not set)
      TEST_SUPABASE_URL:          ${{ secrets.STAGING_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY:     ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_KEY:  ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      # Redis / pg-boss: mocked in jest.config.js — no real connection needed
      REDIS_URL:                  redis://localhost:6379
      DATABASE_POOL_URL:          ${{ secrets.STAGING_DATABASE_URL }}
      # App config
      JWT_SECRET:                 test-jwt-secret-not-used-in-tests
      EXPO_ACCESS_TOKEN:          ${{ secrets.EXPO_ACCESS_TOKEN }}
      GOOGLE_MAPS_API_KEY:        ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests with coverage
        run: |
          npm test -- \
            --coverage \
            --forceExit \
            --testTimeout=30000 \
            --runInBand
        working-directory: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  # ── Job 2: Deploy to Staging (main branch only) ─────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Trigger Render staging deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
        env:
          # RENDER_STAGING_DEPLOY_HOOK: https://api.render.com/deploy/srv-xxx?key=yyy
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}

      - name: Wait for staging to be healthy (90s)
        run: |
          echo "Waiting for staging to come up..."
          sleep 90
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.STAGING_API_URL }}/health")
          echo "Staging health check: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Staging health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Staging healthy"

  # ── Job 3: Deploy to Production (requires manual approval) ──
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      # In GitHub: Settings → Environments → production → Required reviewers
      # Add yourself (or lead engineer) as a required reviewer.
      # The workflow will pause here until approved.

    steps:
      - name: Trigger Render production deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for production to be healthy (120s)
        run: |
          echo "Waiting for production to come up..."
          sleep 120
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.API_BASE_URL }}/health")
          echo "Production health check: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Production health check failed"
            exit 1
          fi
          echo "✅ Production healthy"

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Production deploy complete — $(date)"
